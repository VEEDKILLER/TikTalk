# Whisper large-v3 + LoRA 配置
# 对应原有 config.py 默认值，保证可复现原训练结果

model:
  adapter: whisper
  model_name: openai/whisper-large-v3
  language: english
  task: transcribe

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, v_proj]

training:
  output_dir: ./results/whisper-lora
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1e-4
  num_train_epochs: 5
  warmup_steps: 50
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 3
  seed: 42
  report_to: tensorboard
  logging_dir: ./results/logs

data:
  audio_base_dir: dataset
  metadata_path: dataset/metadata.csv
  audio_dir: dataset/audio
  sampling_rate: 16000
  seed: 42
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: float16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
